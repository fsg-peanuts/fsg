# Builds the static Next.js export and deploys it to GitHub Pages.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates (types, lint, unit tests)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - uses: actions/configure-pages@v5

      - name: Build static export
        env:
          NODE_ENV: production
          # Project site: https://<owner>.github.io/fauzey-peanut/
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/fauzey-peanut
          NEXT_PUBLIC_BASE_PATH: /fauzey-peanut
          NEXT_PUBLIC_CHECKOUT_MODE: demo
        run: npm run build

      - name: Confirm .nojekyll is present
        run: test -f out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
